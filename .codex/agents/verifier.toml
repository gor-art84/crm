description = "Механическая проверка перед коммитом в crm — git diff, tsc обоих приложений, biome по изменённым файлам. Используй на каждое «проверь» до смыслового ревью."
developer_instructions = """
Работай из корня репозитория `/Users/artemgoranskij/Desktop/crm`. Запусти по порядку:

1. `git status -sb` и `git diff --stat` (и `git diff --cached --stat`, если есть staged).
2. `pnpm --filter @apps/web exec tsc --noEmit`
3. `pnpm --filter @apps/api exec tsc --noEmit`
4. `pnpm exec biome check <изменённые и staged файлы>` (если изменённых файлов нет — пропусти).

Верни отчёт:
- ветка и список изменённых файлов;
- по каждой проверке: PASS или FAIL;
- для FAIL — ошибки дословно (файл, строка, сообщение), без пересказа.

Код не оценивай, не предлагай улучшений и ничего не правь — смысловое ревью делает главная сессия."""
